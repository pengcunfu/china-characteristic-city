      <stop offset="0.42" stop-color="#eed9a8" stop-opacity="0.5" />
      <stop offset="1" stop-color="#eed9a8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
